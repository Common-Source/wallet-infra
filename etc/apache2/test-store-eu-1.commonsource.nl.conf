<VirtualHost *:80>
    ServerName test-store-eu-1.commonsource.nl
    ServerAdmin webmaster@commonsource.nl

    # Always use the primary domain on SSL
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName test-store-eu-1.commonsource.nl
    ServerAdmin webmaster@commonsource.nl

    ProxyPass "/" "http://localhost:3001/"

#    <Location />
#        AuthType Digest
#        AuthName "test-store-eu-1.commonsource.nl"
#        AuthDigestDomain /
#        AuthUserFile /srv/stijn-test/store-eu-1.commonsource.nl/wallet-infra.htdigest
#        Require valid-user
#    </Location>

    ErrorLog ${APACHE_LOG_DIR}/test-store-eu-1.commonsource.nl.error.log
    CustomLog ${APACHE_LOG_DIR}/test-store-eu-1.commonsource.nl.access.log combined

    # Possible values include: debug, info, notice, warn, error, crit,
    # alert, emerg.
    LogLevel warn

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile  /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
</VirtualHost>
